<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>robotics-platform — viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1116; color: #d8dde6;
               font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
               overflow: hidden; }
  canvas { display: block; }

  .panel {
    position: absolute; background: rgba(16, 20, 28, 0.92);
    border: 1px solid #232a36; border-radius: 10px; padding: 12px 14px;
    font-size: 12px; line-height: 1.45;
  }
  #hud  { top: 14px; left: 14px; width: 210px; }
  #ctrl { top: 14px; right: 14px; width: 280px; }

  .title { color: #ff9d4d; font-weight: bold; letter-spacing: 0.5px;
           font-size: 12px; margin-bottom: 6px; }
  .row { color: #8a96ad; }
  .v   { color: #e8ecf3; }

  .tabs { display: flex; gap: 4px; margin-bottom: 10px; }
  .tab  { flex: 1; text-align: center; padding: 6px 0; cursor: pointer;
          border: 1px solid #232a36; border-radius: 6px;
          color: #8a96ad; user-select: none; }
  .tab.active { background: #1f2a3d; color: #e8ecf3; border-color: #34465e; }

  .slider-row { display: flex; align-items: center; gap: 8px;
                margin: 6px 0; }
  .slider-row label { width: 56px; color: #8a96ad; font-size: 11px; }
  .slider-row input[type="range"] { flex: 1; }
  .slider-row .num { width: 50px; text-align: right; color: #e8ecf3;
                     font-size: 11px; }

  input[type="range"] {
    -webkit-appearance: none; appearance: none; height: 4px;
    background: #232a36; border-radius: 2px; outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 14px; height: 14px;
    background: #ff9d4d; border-radius: 50%; cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; background: #ff9d4d; border: none;
    border-radius: 50%; cursor: pointer;
  }

  button {
    background: #1f2a3d; color: #e8ecf3; border: 1px solid #34465e;
    border-radius: 5px; padding: 4px 10px; cursor: pointer;
    font: inherit; font-size: 11px;
  }
  button:hover { background: #283446; }
  button.primary { background: #ff9d4d; color: #1a1f28; border-color: #ff9d4d; }

  .group { display: none; }
  .group.active { display: block; }

  .warn { color: #ff7070; margin-top: 6px; font-size: 11px; min-height: 14px; }
  .ok   { color: #6cd29b; margin-top: 6px; font-size: 11px; min-height: 14px; }

  #help { bottom: 14px; left: 14px; color: #6c7a92; font-size: 11px; }
  #help kbd { background: #1a2030; border: 1px solid #2a3a55; padding: 1px 5px;
              border-radius: 4px; font-size: 11px; color: #b0bbd1; }
</style>
</head>
<body>

<div id="hud" class="panel">
  <div class="title">robotics-platform</div>
  <div class="row" id="t">t = 0.00s</div>
  <div class="row" id="joints">…</div>
  <div class="row" id="ee">…</div>
</div>

<div id="ctrl" class="panel">
  <div class="tabs">
    <div class="tab active" data-mode="playback">Playback</div>
    <div class="tab" data-mode="joints">Joints</div>
    <div class="tab" data-mode="ik">IK</div>
  </div>

  <div class="group active" id="g-playback">
    <div style="display: flex; gap: 6px; margin-bottom: 8px;">
      <button id="btn-play" class="primary">⏵ Play</button>
      <button id="btn-reset">⤺ Reset</button>
    </div>
    <div class="slider-row">
      <label>scrub</label>
      <input id="scrub" type="range" min="0" max="1000" value="0" step="1"/>
      <span class="num" id="scrub-v">0.00s</span>
    </div>
    <div class="slider-row">
      <label>speed</label>
      <input id="speed" type="range" min="0.1" max="3" value="1" step="0.05"/>
      <span class="num" id="speed-v">1.00x</span>
    </div>
  </div>

  <div class="group" id="g-joints">
    <div class="slider-row"><label>base</label>
      <input id="j-base" type="range" min="-3.14" max="3.14" step="0.005" value="0"/>
      <span class="num" id="j-base-v">+0.00</span></div>
    <div class="slider-row"><label>shoulder</label>
      <input id="j-shoulder" type="range" min="-1.57" max="3.14" step="0.005" value="0"/>
      <span class="num" id="j-shoulder-v">+0.00</span></div>
    <div class="slider-row"><label>elbow</label>
      <input id="j-elbow" type="range" min="-3.14" max="3.14" step="0.005" value="0"/>
      <span class="num" id="j-elbow-v">+0.00</span></div>
    <div class="slider-row"><label>wrist</label>
      <input id="j-wrist" type="range" min="-3.14" max="3.14" step="0.005" value="0"/>
      <span class="num" id="j-wrist-v">+0.00</span></div>
    <div class="slider-row"><label>gripper</label>
      <input id="j-gripper" type="range" min="0" max="1.2" step="0.005" value="0.6"/>
      <span class="num" id="j-gripper-v">+0.60</span></div>
    <div style="margin-top: 8px;">
      <button id="btn-jhome">Home all joints</button>
    </div>
  </div>

  <div class="group" id="g-ik">
    <div class="slider-row"><label>x (m)</label>
      <input id="ik-x" type="range" min="-0.25" max="0.25" step="0.001" value="0.12"/>
      <span class="num" id="ik-x-v">+0.120</span></div>
    <div class="slider-row"><label>y (m)</label>
      <input id="ik-y" type="range" min="-0.25" max="0.25" step="0.001" value="0.00"/>
      <span class="num" id="ik-y-v">+0.000</span></div>
    <div class="slider-row"><label>z (m)</label>
      <input id="ik-z" type="range" min="0.00" max="0.30" step="0.001" value="0.10"/>
      <span class="num" id="ik-z-v">+0.100</span></div>
    <div class="slider-row"><label>pitch</label>
      <input id="ik-p" type="range" min="-1.57" max="1.57" step="0.01" value="-1.57"/>
      <span class="num" id="ik-p-v">-1.57</span></div>
    <div class="slider-row"><label>grip</label>
      <input id="ik-g" type="range" min="0" max="1.2" step="0.01" value="0.6"/>
      <span class="num" id="ik-g-v">+0.60</span></div>
    <div id="ik-status" class="ok">reachable</div>
  </div>
</div>

<div id="help" class="panel">
  drag <kbd>LMB</kbd> orbit · scroll zoom · <kbd>R</kbd> reset view
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const recording = __RECORDING__;
const { base_height, l1, l2, l3 } = recording;

THREE.Object3D.DEFAULT_UP = new THREE.Vector3(0, 0, 1);

// -- Renderer ------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// -- Scene + camera ------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1116);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 30);
camera.up.set(0, 0, 1);
const cameraHome = new THREE.Vector3(0.36, -0.36, 0.30);
camera.position.copy(cameraHome);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0.08);
controls.enableDamping = true;
controls.dampingFactor = 0.1;

// -- Minimal lighting: one ambient + one directional ---------------------
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(0.6, 0.4, 1.0);
scene.add(sun);

// -- Floor (matte, no reflections) ---------------------------------------
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(0.5, 48),
  new THREE.MeshLambertMaterial({ color: 0x161b22 }),
);
scene.add(floor);

// Faint grid
const gridMat = new THREE.LineBasicMaterial({ color: 0x232a36 });
const gridGroup = new THREE.Group();
for (let i = -5; i <= 5; i++) {
  const a = i * 0.05;
  gridGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
    [new THREE.Vector3(-0.25, a, 0.001), new THREE.Vector3(0.25, a, 0.001)]), gridMat));
  gridGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
    [new THREE.Vector3(a, -0.25, 0.001), new THREE.Vector3(a, 0.25, 0.001)]), gridMat));
}
scene.add(gridGroup);

// Origin axes
scene.add(new THREE.AxesHelper(0.05));

// -- Robot kinematic chain ----------------------------------------------
const flat = (color) => new THREE.MeshLambertMaterial({ color });

const basePivot = new THREE.Object3D();
scene.add(basePivot);

const baseCyl = new THREE.Mesh(
  new THREE.CylinderGeometry(0.04, 0.045, base_height, 24),
  flat(0x3a4456),
);
baseCyl.rotation.x = Math.PI / 2;
baseCyl.position.z = base_height / 2;
basePivot.add(baseCyl);

const shoulder = new THREE.Object3D();
shoulder.position.z = base_height;
basePivot.add(shoulder);

function linkMesh(length, color, thickness = 0.022) {
  const g = new THREE.BoxGeometry(length, thickness, thickness);
  const m = new THREE.Mesh(g, flat(color));
  m.position.x = length / 2;
  return m;
}
shoulder.add(linkMesh(l1, 0xc8ccd6));

const elbow = new THREE.Object3D();
elbow.position.x = l1;
shoulder.add(elbow);
elbow.add(linkMesh(l2, 0xb3b8c6));

const wrist = new THREE.Object3D();
wrist.position.x = l2;
elbow.add(wrist);
wrist.add(linkMesh(l3, 0xa0a6b6, 0.018));

// Gripper
const gripperRoot = new THREE.Object3D();
gripperRoot.position.x = l3;
wrist.add(gripperRoot);

const palm = new THREE.Mesh(new THREE.BoxGeometry(0.014, 0.022, 0.022), flat(0x2a3346));
palm.position.x = 0.007;
gripperRoot.add(palm);

function finger() {
  const f = new THREE.Mesh(new THREE.BoxGeometry(0.020, 0.005, 0.022), flat(0x1c2434));
  f.position.x = 0.020;
  return f;
}
const fingerL = finger();
const fingerR = finger();
gripperRoot.add(fingerL);
gripperRoot.add(fingerR);

const toolDot = new THREE.Mesh(
  new THREE.SphereGeometry(0.005, 12, 12),
  new THREE.MeshBasicMaterial({ color: 0xff9d4d }),
);
toolDot.position.x = 0.026;
gripperRoot.add(toolDot);

// -- IK target marker (visible only in IK mode) -------------------------
const ikTarget = new THREE.Mesh(
  new THREE.SphereGeometry(0.008, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0x4cb0ff, transparent: true, opacity: 0.85 }),
);
ikTarget.visible = false;
scene.add(ikTarget);

// -- Cubes ---------------------------------------------------------------
const cubeMeshes = new Map();
function ensureCube(id) {
  if (!cubeMeshes.has(id)) {
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(0.026, 0.026, 0.026),
      flat(0xff4060),
    );
    scene.add(m);
    cubeMeshes.set(id, m);
  }
  return cubeMeshes.get(id);
}

// -- IK in JS (mirrors crates/kinematics/src/ik.rs) ----------------------
function solveIK(x, y, z, phi, grip) {
  const theta_b = Math.atan2(y, x);
  const r_world = Math.sqrt(x * x + y * y);
  const z_s = z - base_height;
  const r_w = r_world - l3 * Math.cos(phi);
  const z_w = z_s - l3 * Math.sin(phi);
  const dist_sq = r_w * r_w + z_w * z_w;
  const reach_max = l1 + l2;
  const reach_min = Math.abs(l1 - l2);
  if (dist_sq > (reach_max + 1e-4) ** 2 || dist_sq < (reach_min - 1e-4) ** 2)
    return { reachable: false };
  const cos_e = Math.max(-1, Math.min(1, (dist_sq - l1*l1 - l2*l2) / (2 * l1 * l2)));
  const theta_e = -Math.acos(cos_e);
  const theta_s = Math.atan2(z_w, r_w) - Math.atan2(l2 * Math.sin(theta_e), l1 + l2 * Math.cos(theta_e));
  const theta_w = phi - theta_s - theta_e;
  return {
    reachable: true,
    joints: { base: theta_b, shoulder: theta_s, elbow: theta_e, wrist: theta_w, gripper: grip },
  };
}

// -- Apply joint state to the scene --------------------------------------
const _v = new THREE.Vector3();
function applyJoints(j) {
  basePivot.rotation.z = j.base;
  shoulder.rotation.y  = -j.shoulder;
  elbow.rotation.y     = -j.elbow;
  wrist.rotation.y     = -j.wrist;
  const spread = 0.003 + Math.max(0, Math.min(1.2, j.gripper)) * 0.011;
  fingerL.position.y =  spread;
  fingerR.position.y = -spread;
  for (const o of currentObjects) ensureCube(o.id).position.set(o.x, o.y, o.z);
  toolDot.getWorldPosition(_v);
  document.getElementById('joints').innerHTML =
    `base=<span class="v">${j.base.toFixed(2)}</span> ` +
    `sh=<span class="v">${j.shoulder.toFixed(2)}</span> ` +
    `el=<span class="v">${j.elbow.toFixed(2)}</span><br>` +
    `wr=<span class="v">${j.wrist.toFixed(2)}</span> ` +
    `g=<span class="v">${j.gripper.toFixed(2)}</span>`;
  document.getElementById('ee').innerHTML =
    `EE = (<span class="v">${_v.x.toFixed(3)}</span>, ` +
    `<span class="v">${_v.y.toFixed(3)}</span>, ` +
    `<span class="v">${_v.z.toFixed(3)}</span>) m`;
}

let currentObjects = recording.frames[0]?.objects?.slice() ?? [];

// -- Mode handling -------------------------------------------------------
let mode = 'playback';
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.group').forEach(g => g.classList.remove('active'));
    tab.classList.add('active');
    mode = tab.dataset.mode;
    document.getElementById('g-' + mode).classList.add('active');
    ikTarget.visible = (mode === 'ik');
    if (mode === 'joints')       applyJointSliders();
    else if (mode === 'ik')      applyIkSliders();
  });
});

// -- Playback ------------------------------------------------------------
const totalT = recording.frames.length
  ? recording.frames[recording.frames.length - 1].t : 0;
const tEl = document.getElementById('t');
const scrub = document.getElementById('scrub');
const scrubV = document.getElementById('scrub-v');
const speedSlider = document.getElementById('speed');
const speedV = document.getElementById('speed-v');
const btnPlay = document.getElementById('btn-play');
const btnReset = document.getElementById('btn-reset');

let playing = true;
let playT = 0;       // current playback time in seconds
let lastWall = performance.now();
let playSpeed = 1.0;

btnPlay.addEventListener('click', () => {
  playing = !playing;
  btnPlay.textContent = playing ? '⏸ Pause' : '⏵ Play';
  btnPlay.classList.toggle('primary', !playing);
});
btnReset.addEventListener('click', () => { playT = 0; });
speedSlider.addEventListener('input', () => {
  playSpeed = parseFloat(speedSlider.value);
  speedV.textContent = playSpeed.toFixed(2) + 'x';
});
scrub.addEventListener('input', () => {
  playT = (parseFloat(scrub.value) / 1000) * totalT;
  if (playing) { playing = false; btnPlay.textContent = '⏵ Play'; btnPlay.classList.add('primary'); }
});

function frameAt(t) {
  const fs = recording.frames;
  if (!fs.length) return null;
  if (t <= fs[0].t) return fs[0];
  for (let i = 1; i < fs.length; i++) {
    if (fs[i].t >= t) {
      const a = fs[i - 1], b = fs[i];
      const u = (t - a.t) / Math.max(1e-6, b.t - a.t);
      const lerp = (x, y) => x + (y - x) * u;
      return {
        t, base: lerp(a.base, b.base), shoulder: lerp(a.shoulder, b.shoulder),
        elbow: lerp(a.elbow, b.elbow), wrist: lerp(a.wrist, b.wrist),
        gripper: lerp(a.gripper, b.gripper), objects: b.objects,
      };
    }
  }
  return fs[fs.length - 1];
}

// -- Joint sliders -------------------------------------------------------
function bindSlider(id) {
  const el = document.getElementById(id);
  const vEl = document.getElementById(id + '-v');
  el.addEventListener('input', () => {
    const v = parseFloat(el.value);
    vEl.textContent = (v >= 0 ? '+' : '') + v.toFixed(2);
    if (id.startsWith('j-')) applyJointSliders();
    else if (id.startsWith('ik-')) applyIkSliders();
  });
}
['j-base','j-shoulder','j-elbow','j-wrist','j-gripper'].forEach(bindSlider);
['ik-x','ik-y','ik-z','ik-p','ik-g'].forEach(bindSlider);

document.getElementById('btn-jhome').addEventListener('click', () => {
  for (const [id, val] of [['j-base',0],['j-shoulder',0],['j-elbow',0],['j-wrist',0],['j-gripper',0.6]]) {
    const el = document.getElementById(id);
    el.value = val;
    document.getElementById(id + '-v').textContent = (val >= 0 ? '+' : '') + val.toFixed(2);
  }
  applyJointSliders();
});

function applyJointSliders() {
  const j = {
    base:     parseFloat(document.getElementById('j-base').value),
    shoulder: parseFloat(document.getElementById('j-shoulder').value),
    elbow:    parseFloat(document.getElementById('j-elbow').value),
    wrist:    parseFloat(document.getElementById('j-wrist').value),
    gripper:  parseFloat(document.getElementById('j-gripper').value),
  };
  applyJoints(j);
}

// -- IK sliders ----------------------------------------------------------
const ikStatus = document.getElementById('ik-status');
function applyIkSliders() {
  const x = parseFloat(document.getElementById('ik-x').value);
  const y = parseFloat(document.getElementById('ik-y').value);
  const z = parseFloat(document.getElementById('ik-z').value);
  const p = parseFloat(document.getElementById('ik-p').value);
  const g = parseFloat(document.getElementById('ik-g').value);
  ikTarget.position.set(x, y, z);
  const sol = solveIK(x, y, z, p, g);
  if (!sol.reachable) {
    ikStatus.textContent = 'unreachable';
    ikStatus.className = 'warn';
    ikTarget.material.color.set(0xff7070);
    return;
  }
  ikStatus.textContent = 'reachable';
  ikStatus.className = 'ok';
  ikTarget.material.color.set(0x4cb0ff);
  applyJoints(sol.joints);
}

// Initialize HUD with first frame
if (recording.frames.length) {
  applyJoints(recording.frames[0]);
}

// -- Keys ----------------------------------------------------------------
addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') {
    camera.position.copy(cameraHome);
    controls.target.set(0, 0, 0.08);
  }
});

// -- Main loop ------------------------------------------------------------
function tick() {
  const now = performance.now();
  const dt = (now - lastWall) / 1000;
  lastWall = now;

  if (mode === 'playback') {
    if (playing && totalT > 0) {
      playT += dt * playSpeed;
      if (playT > totalT) playT = 0; // loop
    }
    const f = frameAt(playT);
    if (f) {
      currentObjects = f.objects;
      applyJoints(f);
      scrub.value = String(Math.round((playT / totalT) * 1000));
      scrubV.textContent = playT.toFixed(2) + 's';
      tEl.textContent = `t = ${playT.toFixed(2)}s / ${totalT.toFixed(2)}s`;
    }
  } else {
    tEl.textContent = mode === 'joints' ? 'manual joints' : 'live IK';
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
