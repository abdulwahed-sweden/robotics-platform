[package]
name = "robotics-gpio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Raspberry Pi GPIO/PWM wrapper (Linux + ARM only). Falls back to a stub on macOS/Windows so the workspace builds everywhere."

[dependencies]
robotics-core = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

# rppal is Linux-only. Cargo's target-specific deps mean it simply
# disappears on macOS/Windows; the stub PWM path below is used instead.
[target.'cfg(target_os = "linux")'.dependencies]
rppal = { workspace = true }
