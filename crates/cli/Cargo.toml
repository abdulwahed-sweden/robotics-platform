[package]
name = "robotics-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command-line entry point — picks a backend, loads configs, runs the planner"

[[bin]]
name = "robotics"
path = "src/main.rs"

[dependencies]
robotics-core = { workspace = true }
robotics-kinematics = { workspace = true }
robotics-motion = { workspace = true }
robotics-simulation = { workspace = true }
robotics-hardware = { workspace = true }
robotics-gpio = { workspace = true }
robotics-planner = { workspace = true }
robotics-protocols = { workspace = true }
robotics-vision = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[[example]]
name = "pick_and_place"
path = "examples/pick_and_place.rs"
